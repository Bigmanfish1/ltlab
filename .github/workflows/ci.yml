name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ruff
        run: pip install -r backend/requirements.txt

      - name: Run lint
        run: cd backend && ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ltlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key-not-used-in-production
      DEBUG: "True"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ltlab_test
      DJANGO_SETTINGS_MODULE: config.settings.development

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run tests
        working-directory: backend
        run: python manage.py test

  vulnerability-scan:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Build Docker image
        run: docker build -t ltlab:${{ github.sha }} ./backend

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ltlab:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  deploy:
    runs-on: ubuntu-latest
    needs: vulnerability-scan
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    # Workload Identity Federation — GitHub authenticates to GCP with a
    # short-lived OIDC token, no long-lived service-account key. The provider is
    # locked to this repo's owner (see GCP workloadIdentityPools/github-pool).
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT: project-10a4cc96-5dd3-4010-8a3
      GCP_REGION: us-central1
      CLOUD_RUN_SERVICE: ltlab
      WIF_PROVIDER: projects/87262955263/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      DEPLOY_SA: gh-deploy@project-10a4cc96-5dd3-4010-8a3.iam.gserviceaccount.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Builds from backend/Dockerfile via Cloud Build and rolls out a new
      # revision. Env vars, scaling, and resource limits already set on the
      # service are retained (Cloud Run merges unspecified settings).
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --source backend \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --quiet