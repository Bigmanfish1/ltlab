name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ruff
        run: pip install -r backend/requirements.txt

      - name: Run lint
        run: cd backend && ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ltlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key-not-used-in-production
      DEBUG: "True"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ltlab_test
      DJANGO_SETTINGS_MODULE: config.settings.development

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run tests
        working-directory: backend
        run: python manage.py test

  vulnerability-scan:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Build Docker image
        run: docker build -t ltlab:${{ github.sha }} ./backend

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ltlab:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  deploy:
    runs-on: ubuntu-latest
    needs: vulnerability-scan
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/feature/gcp-cloud-run-migration')

    # WIF: GitHub auths to GCP with a short-lived OIDC token (no stored key);
    # provider locked to this repo's owner.
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT: project-10a4cc96-5dd3-4010-8a3
      GCP_REGION: us-central1
      CLOUD_RUN_SERVICE: ltlab
      MIGRATE_JOB: ltlab-migrate
      WIF_PROVIDER: projects/87262955263/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      DEPLOY_SA: gh-deploy@project-10a4cc96-5dd3-4010-8a3.iam.gserviceaccount.com
      IMAGE: us-central1-docker.pkg.dev/project-10a4cc96-5dd3-4010-8a3/ltlab/ltlab:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1

      # Build once so the migrate Job and the service share the identical image.
      - name: Build image
        run: |
          gcloud builds submit backend \
            --tag "$IMAGE" --project "$GCP_PROJECT" --quiet

      # Migrate once before the new revision serves, via a one-off Job (not per
      # instance). --fake-initial matches the externally-managed Supabase schema.
      - name: Apply database migrations
        run: |
          gcloud run jobs update "$MIGRATE_JOB" --image "$IMAGE" \
            --region "$GCP_REGION" --project "$GCP_PROJECT" --quiet
          gcloud run jobs execute "$MIGRATE_JOB" --wait \
            --region "$GCP_REGION" --project "$GCP_PROJECT"

      # Roll out the same image; existing env vars and scaling are retained.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" --image "$IMAGE" \
            --region "$GCP_REGION" --project "$GCP_PROJECT" --quiet