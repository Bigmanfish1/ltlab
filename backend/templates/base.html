<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ModelCheck Edu{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bg-primary': '#0A0A0A',
                        'bg-secondary': '#111111',
                        'bg-tertiary': '#1F1F1F',
                        'border-primary': '#1F1F1F',
                        'border-secondary': '#2A2A2A',
                        'text-primary': '#FAFAFA',
                        'text-secondary': '#6B6B6B',
                        'accent-orange': '#FF4D00',
                        'accent-lime': '#AEFC00',
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        .app-toast {
            animation: app-toast-in .25s ease both;
            transition: opacity .25s ease, transform .25s ease;
        }
        .app-toast.hide { opacity: 0; transform: translateX(24px); }
        @keyframes app-toast-in {
            from { opacity: 0; transform: translateX(24px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-bg-primary text-text-primary antialiased"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    {% if messages %}
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 space-y-2 max-w-sm">
        {% for message in messages %}
        <div class="app-toast flex items-start gap-3 text-bg-primary text-[13px] px-4 py-3 rounded shadow-lg {% if message.tags == 'error' %}bg-accent-orange{% else %}bg-accent-lime{% endif %}">
            <span class="flex-1">{{ message }}</span>
            <button type="button" class="js-toast-dismiss leading-none text-lg">&times;</button>
        </div>
        {% endfor %}
    </div>
    <script>
        (function () {
            const container = document.getElementById('toast-container');
            if (!container) return;
            function dismiss(toast) {
                toast.classList.add('hide');
                setTimeout(function () { toast.remove(); }, 250);
            }
            container.addEventListener('click', function (e) {
                if (e.target.closest('.js-toast-dismiss')) dismiss(e.target.closest('.app-toast'));
            });
            setTimeout(function () {
                container.querySelectorAll('.app-toast').forEach(dismiss);
            }, 4000);
        })();
    </script>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
