<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ModelCheck Edu{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bg-primary': '#0A0A0A',
                        'bg-secondary': '#111111',
                        'bg-tertiary': '#1F1F1F',
                        'border-primary': '#1F1F1F',
                        'border-secondary': '#2A2A2A',
                        'text-primary': '#FAFAFA',
                        'text-secondary': '#6B6B6B',
                        'accent-orange': '#FF4D00',
                        'accent-lime': '#AEFC00',
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-bg-primary text-text-primary antialiased">
    {% if messages %}
    <div class="max-w-[1280px] mx-auto px-12 pt-4">
        {% for message in messages %}
        <div class="px-4 py-3 mb-2 rounded text-bg-primary text-[13px] {% if message.tags == 'error' %}bg-accent-orange{% else %}bg-accent-lime{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
