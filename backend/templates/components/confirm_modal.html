<div id="confirm-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6">
    <div class="js-confirm-cancel absolute inset-0 bg-black/70"></div>
    <div class="relative w-full max-w-sm bg-bg-secondary border border-border-secondary rounded-lg shadow-2xl">
        <div class="px-6 py-5">
            <h2 class="text-[16px] text-text-primary font-semibold mb-2">Confirm deletion</h2>
            <p id="confirm-message" class="text-[13px] text-text-secondary leading-relaxed"></p>
        </div>
        <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-border-primary">
            <button type="button" class="js-confirm-cancel px-4 py-2 font-mono text-[11px] tracking-[0.12em] uppercase text-text-secondary hover:text-text-primary transition-colors">Cancel</button>
            <button type="button" id="confirm-delete" class="px-4 py-2 bg-accent-orange text-bg-primary font-mono text-[11px] tracking-[0.12em] uppercase rounded hover:opacity-90 transition-opacity">Delete</button>
        </div>
    </div>
</div>
<script>
    (function () {
        const modal = document.getElementById('confirm-modal');
        const message = document.getElementById('confirm-message');
        let pendingForm = null;

        function close() { modal.classList.add('hidden'); pendingForm = null; }

        document.addEventListener('submit', function (e) {
            const form = e.target.closest('.js-delete-form');
            if (!form) return;
            e.preventDefault();
            pendingForm = form;
            message.textContent = form.dataset.confirm || 'Are you sure?';
            modal.classList.remove('hidden');
        });
        modal.querySelectorAll('.js-confirm-cancel').forEach(function (b) {
            b.addEventListener('click', close);
        });
        document.getElementById('confirm-delete').addEventListener('click', function () {
            if (pendingForm) pendingForm.submit();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && !modal.classList.contains('hidden')) close();
        });
    })();
</script>
