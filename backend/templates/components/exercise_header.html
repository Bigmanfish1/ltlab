{# Student exercise-page header: title, type badge, completion pill, prev/next nav. #}
<div class="border-b border-border-primary">
    <div class="max-w-[1280px] mx-auto px-12 py-6">
        <div class="flex items-center justify-between mb-2">
            <div>
                <h1 class="text-2xl text-text-primary font-semibold tracking-tight">
                   Exercise {{ exercise_number }} · {{ exercise.title }}
                </h1>
                <div class="flex items-center mt-2 gap-2">
                    <span class="font-mono text-[11px] px-2 py-1 bg-bg-secondary border border-border-secondary text-text-secondary rounded">
                        {{ type_badge|upper }}
                    </span>
                    <span id="exercise-completed-badge"
                        class="font-mono text-[11px] px-2 py-1 bg-accent-lime text-bg-primary rounded{% if not is_completed %} hidden{% endif %}">
                        ✓ COMPLETED
                    </span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                {% if prev_exercise %}
                <a href="{% url 'exercise_canvas' prev_exercise.id %}" class="px-3 py-2 bg-bg-secondary border border-border-secondary hover:border-accent-orange transition-colors rounded text-sm">
                    ← Prev
                </a>
                {% endif %}
                {% if next_exercise %}
                <a href="{% url 'exercise_canvas' next_exercise.id %}" class="px-3 py-2 bg-bg-secondary border border-border-secondary hover:border-accent-orange transition-colors rounded text-sm">
                    Next →
                </a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
