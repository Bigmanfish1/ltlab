{# Quick-insert buttons for a part row's formula input (builder). #}
<div class="part-ops flex flex-wrap gap-1 mt-2">
    <button type="button" data-insert="G" title="Always" class="part-op w-7 h-7 font-mono text-[12px] border border-border-primary text-text-secondary rounded hover:border-border-secondary hover:text-text-primary transition-colors">G</button>
    <button type="button" data-insert="F" title="Eventually" class="part-op w-7 h-7 font-mono text-[12px] border border-border-primary text-text-secondary rounded hover:border-border-secondary hover:text-text-primary transition-colors">F</button>
    <button type="button" data-insert="X" title="Next" class="part-op w-7 h-7 font-mono text-[12px] border border-border-primary text-text-secondary rounded hover:border-border-secondary hover:text-text-primary transition-colors">X</button>
    <button type="button" data-insert="U" title="Until" class="part-op w-7 h-7 font-mono text-[12px] border border-border-primary text-text-secondary rounded hover:border-border-secondary hover:text-text-primary transition-colors">U</button>
    <button type="button" data-insert="¬" title="Not" class="part-op w-7 h-7 font-mono text-[12px] border border-border-primary text-text-secondary rounded hover:border-border-secondary hover:text-text-primary transition-colors">¬</button>
    <button type="button" data-insert="∧" title="And" class="part-op w-7 h-7 font-mono text-[12px] border border-border-primary text-text-secondary rounded hover:border-border-secondary hover:text-text-primary transition-colors">∧</button>
    <button type="button" data-insert="∨" title="Or" class="part-op w-7 h-7 font-mono text-[12px] border border-border-primary text-text-secondary rounded hover:border-border-secondary hover:text-text-primary transition-colors">∨</button>
    <button type="button" data-insert="|" title="Or" class="part-op w-7 h-7 font-mono text-[12px] border border-border-primary text-text-secondary rounded hover:border-border-secondary hover:text-text-primary transition-colors">|</button>
    <button type="button" data-insert="→" title="Implies" class="part-op w-7 h-7 font-mono text-[12px] border border-border-primary text-text-secondary rounded hover:border-border-secondary hover:text-text-primary transition-colors">→</button>
    <button type="button" data-insert="()" title="Parentheses" class="part-op w-7 h-7 font-mono text-[12px] border border-border-primary text-text-secondary rounded hover:border-border-secondary hover:text-text-primary transition-colors">()</button>
</div>
