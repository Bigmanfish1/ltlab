{# Per-part progressive hints editor (builder part rows). #}
<details class="part-hints mt-2">
    <summary class="font-mono text-[11px] tracking-[0.12em] text-text-secondary cursor-pointer select-none hover:text-text-primary transition-colors">HINTS (OPTIONAL, UP TO 3)</summary>
    <div class="space-y-2 mt-2">
        <input type="text" data-part-hint placeholder="Hint 1..."
            class="w-full bg-bg-primary border border-border-primary text-text-primary placeholder-text-secondary text-[12px] px-3 py-1.5 rounded focus:border-border-secondary focus:outline-none transition-colors" />
        <input type="text" data-part-hint placeholder="Hint 2..."
            class="w-full bg-bg-primary border border-border-primary text-text-primary placeholder-text-secondary text-[12px] px-3 py-1.5 rounded focus:border-border-secondary focus:outline-none transition-colors" />
        <input type="text" data-part-hint placeholder="Hint 3..."
            class="w-full bg-bg-primary border border-border-primary text-text-primary placeholder-text-secondary text-[12px] px-3 py-1.5 rounded focus:border-border-secondary focus:outline-none transition-colors" />
    </div>
</details>
