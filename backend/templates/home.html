{% extends "base.html" %}

{% block title %}ltlab — LTL Model Checking Educational Tool{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col">
  <header class="border-b border-slate-800 px-6 h-12 flex items-center justify-between bg-bg-primary">
      <div class="font-mono text-sm font-semibold tracking-tight text-text-primary">
          LTLab
      </div>
      <nav class="absolute left-1/2 -translate-x-1/2 flex items-center gap-8">
          <a href="{% url 'home' %}" 
            class="font-mono text-[11px] tracking-[0.12em] uppercase transition-colors
                    {% if request.resolver_match.url_name == 'home' %}text-text-primary font-bold{% else %}text-text-secondary hover:text-text-primary{% endif %}">
              Dashboard
          </a>
          <a href="#" 
            class="font-mono text-[11px] tracking-[0.12em] uppercase transition-colors
                    {% if request.resolver_match.url_name == 'exercises' %}text-text-primary font-bold{% else %}text-text-secondary hover:text-text-primary{% endif %}">
              Exercises
          </a>
          <a href="{% url 'sandbox' %}" 
            class="font-mono text-[11px] tracking-[0.12em] uppercase transition-colors
                    {% if request.resolver_match.url_name == 'sandbox' %}text-text-primary font-bold{% else %}text-text-secondary hover:text-text-primary{% endif %}">
              Sandbox
          </a>
          <a href="#" 
            class="font-mono text-[11px] tracking-[0.12em] uppercase transition-colors
                    {% if request.resolver_match.url_name == 'results' %}text-text-primary font-bold{% else %}text-text-secondary hover:text-text-primary{% endif %}">
              Results
          </a>
      </nav>
      <div class="font-mono text-[11px] tracking-[0.12em] text-text-secondary uppercase">
          KB
      </div>
  </header>

  {% include "dashboard/student_dashboard.html" %}

</div>
{% endblock %}
