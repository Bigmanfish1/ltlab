<div id="pending-wrapper"
     data-task-id="{{ task_id }}"
     data-poll-count="0"
     data-start-ms="{{ now_ms|default:0 }}">

  <div class="h-full flex items-center justify-between px-4 gap-3"
       id="pending-inner">

    <div class="flex items-center gap-2 border-l-2 border-[#6B6B6B] bg-[#111111] px-4 py-2 font-mono text-[12px] text-[#6B6B6B]">
      <svg id="pending-spinner" class="animate-spin w-3 h-3 shrink-0" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="31.4" stroke-dashoffset="10"/>
      </svg>
      <span id="pending-msg">Running verification…</span>
    </div>

    <!-- Stop / cancel button -->
    <button
      id="stop-btn"
      onclick="cancelVerification()"
      class="font-mono text-[11px] text-[#6B6B6B] hover:text-[#FAFAFA] border border-[#2A2A2A] hover:border-[#FF4D00] px-3 py-1.5 rounded transition-colors whitespace-nowrap shrink-0">
      Stop
    </button>
  </div>
</div>

<script>
(function () {
  const wrapper   = document.getElementById('pending-wrapper');
  const taskId    = wrapper ? wrapper.dataset.taskId : '';
  const statusUrl = '{% url "sandbox_verify_status" task_id="__TASK_ID__" %}'.replace('__TASK_ID__', taskId);
  const cancelUrl = '{% url "sandbox_verify_cancel" %}';
  const drawer    = document.getElementById('result-drawer');

  let pollCount   = 0;
  let timerId     = null;
  let cancelled   = false;

  function scheduleNext() {
    // Exponential backoff: 400 ms → 800 → 1600 → cap at 3000 ms.
    const delay = Math.min(400 * Math.pow(1.6, pollCount), 3000);
    pollCount++;

    // After ~20 seconds (~10 polls) show a "still running" notice.
    if (pollCount === 10) {
      const msg = document.getElementById('pending-msg');
      if (msg) msg.textContent = 'Still running — this may take a moment…';
    }

    timerId = setTimeout(poll, delay);
  }

  function poll() {
    if (cancelled) return;
    fetch(statusUrl, { credentials: 'same-origin' })
      .then(r => r.text())
      .then(html => {
        if (cancelled) return;
        // If the response contains the pending wrapper we're still running.
        if (html.includes('pending-wrapper')) {
          scheduleNext();
        } else {
          // Result arrived — swap into the drawer and restore the Run button.
          drawer.innerHTML = html;
          drawer.style.minHeight = html.trim() ? '100px' : '0';
          if (typeof enableRunBtn === 'function') enableRunBtn();
        }
      })
      .catch(() => { if (!cancelled) scheduleNext(); });
  }

  window.cancelVerification = function () {
    cancelled = true;
    clearTimeout(timerId);
    // Fire the revoke request (fire-and-forget).
    if (taskId) {
      const fd = new FormData();
      fd.append('task_id', taskId);
      // Include CSRF token from cookie.
      const csrf = (document.cookie.match(/csrftoken=([^;]+)/) || [])[1] || '';
      if (csrf) fd.append('csrfmiddlewaretoken', csrf);
      fetch(cancelUrl, { method: 'POST', body: fd, credentials: 'same-origin' })
        .catch(() => {});
    }
    drawer.innerHTML = '';
    drawer.style.minHeight = '0';
    if (typeof enableRunBtn === 'function') enableRunBtn();
  };

  scheduleNext();
})();
</script>
