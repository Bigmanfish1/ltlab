# Ruff configuration for ltlab
# Intentionally lenient — catches real errors, not style opinions

[lint]
# E9   — syntax errors
# F63  — invalid syntax
# F7   — undefined names
# F82  — undefined variables
select = ["E9", "F63", "F7", "F82"]

# F401 — unused imports (teammate uses noqa: F401 comments already)
ignore = ["F401"]

# Exclude common non-source directories
exclude = [
    ".git",
    "__pycache__",
    "migrations",
    "staticfiles",
    ".venv",
]